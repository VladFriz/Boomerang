<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boomerang Mini App</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0d0e12;
            --container-bg: #161820;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --text-muted: #8a8f9d;
            
            /* Цвета редкостей */
            --rarity-common: #b0c3d9;
            --rarity-restricted: #7798e1;
            --rarity-classified: #d32ce6;
            --rarity-covert: #eb4b4b;
            --rarity-special: #e4ae39;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--container-bg);
            padding: 12px 20px;
            border-radius: 12px;
            box-sizing: border-box;
            border: 1px solid #232736;
            margin-bottom: 15px;
        }
        .balance {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .main-container {
            width: 100%;
            background: var(--container-bg);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #232736;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.05);
        }

        .case-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .case-price {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }
        /* Рулетка */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 110px;
            background: #090a0d;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #232736;
        }

        .roulette-marker {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent-color);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 5px;
            height: 100px;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            will-change: transform;
        }
        .roulette-item {
            width: 90px;
            height: 100px;
            margin-right: 5px;
            background: #12141c;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border-bottom: 4px solid var(--rarity-common);
            flex-shrink: 0;
        }

        .roulette-item img {
            width: 70px;
            height: 50px;
            object-fit: contain;
        }

        /* Настройки мульти-открытия */
        .controls-section {
            margin-bottom: 20px;
            background: #0f1117;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f222e;
        }
        .multiplier-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .multiplier-selector label {
            font-size: 14px;
            color: var(--text-muted);
        }

        .count-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-btn {
            background: #1f222e;
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .count-value {
            font-size: 16px;
            font-weight: bold;
            width: 25px;
        }
        /* Кнопки */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(135deg, #00ffcc 0%, #00b3ff 100%);
            border: none;
            color: #000;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .action-btn.fast-btn {
            background: #1f222e;
            color: var(--text-color);
            border: 1px solid #33384a;
        }

        .action-btn:active {
            opacity: 0.8;
        }
        /* Показ выигрыша мульти-открытия */
        .win-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 6, 8, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .win-modal {
            background: var(--container-bg);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 340px;
            border: 1px solid #232736;
            text-align: center;
        }

        .win-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 20px 0;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .win-card {
            background: #11131a;
            border-radius: 6px;
            padding: 8px;
            font-size: 10px;
            text-align: center;
            border-bottom: 3px solid white;
        }

        .win-card img {
            width: 100%;
            height: 40px;
            object-fit: contain;
        }

        .close-win-btn {
            background: var(--text-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
        }

        /* Раздел профиля */
        .profile-section {
            width: 100%;
            margin-top: 15px;
            background: var(--container-bg);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #232736;
        }
        .profile-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: left;
            color: var(--text-muted);
        }

        .inventory-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: left;
        }

        .inventory-item {
            background: #11131a;
            border-radius: 6px;
            padding: 5px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid white;
            position: relative;
            cursor: pointer;
        }

        .inventory-item img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        /* Окно подтверждения продажи скина */
        .sell-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 6, 8, 0.9);
            z-index: 110;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .sell-modal {
            background: #161820;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 300px;
            border: 1px solid #232736;
            text-align: center;
        }

        .sell-modal img {
            width: 120px;
            height: 80px;
            object-fit: contain;
            margin: 15px 0;
        }

        .sell-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .sell-action-btn {
            flex: 1;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .sell-confirm {
            background: #ff4a4a;
            color: white;
        }

        .sell-cancel {
            background: #1f222e;
            color: #8a8f9d;
            border: 1px solid #33384a;
        }
    </style>
</head>
<body>
    <div class="header">
        <div id="username-display">Игрок</div>
        <div class="balance"><span id="balance-val">5000</span> ₽</div>
    </div>

    <div class="main-container">
        <div class="case-title">Boomerang Case</div>
        <div class="case-price">Цена одного открытия: <span id="case-cost">150</span> ₽</div>

        <div class="roulette-wrapper">
            <div class="roulette-marker"></div>
            <div class="roulette-track" id="roulette-track"></div>
        </div>

        <div class="controls-section">
            <div class="multiplier-selector">
                <label>Количество кейсов (1-10):</label>
                <div class="count-picker">
                    <button class="count-btn" onclick="changeCount(-1)">-</button>
                    <span class="count-value" id="cases-count">1</span>
                    <button class="count-btn" onclick="changeCount(1)">+</button>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="action-btn" id="open-btn" onclick="startOpen(false)">Открыть</button>
            <button class="action-btn fast-btn" id="fast-btn" onclick="startOpen(true)">Быстро</button>
        </div>
    </div>

    <div class="profile-section">
        <div class="profile-title">Ваш инвентарь (Скины)</div>
        <div class="inventory-list" id="inventory-list"></div>
    </div>

    <div class="win-overlay" id="win-overlay">
        <div class="win-modal">
            <h3 style="margin-top:0;">Вы получили:</h3>
            <div class="win-grid" id="win-grid"></div>
            <button class="close-win-btn" onclick="closeWinOverlay()">Отлично</button>
        </div>
    </div>

    <div class="sell-overlay" id="sell-overlay">
        <div class="sell-modal">
            <h4 style="margin:0;" id="sell-item-rarity">РЕДКОСТЬ</h4>
            <h3 style="margin:5px 0 0 0; color:#fff;" id="sell-item-name">Название скина</h3>
            <div id="sell-image-container"></div>
            <p style="color:#00ffcc; font-weight:bold; margin:10px 0;">Цена продажи: <span id="sell-item-price">0</span> ₽</p>
            <div class="sell-btn-group">
                <button class="sell-action-btn sell-confirm" onclick="confirmSell()">Продать</button>
                <button class="sell-action-btn sell-cancel" onclick="closeSellModal()">Отмена</button>
            </div>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username-display').innerText = tg.initDataUnsafe.user.first_name;
        }

        const skinsPool = [
            { id: 1, name: "Charm | Chicken", rarity: "common", color: "#b0c3d9", chance: 45, img: "https://imgur.com", sellPrice: 25 },
            { id: 2, name: "UMP-45 | K.O. Factory", rarity: "restricted", color: "#7798e1", chance: 28, img: "https://imgur.com", sellPrice: 60 },
            { id: 3, name: "P90 | Scarab Rush", rarity: "restricted", color: "#7798e1", chance: 15, img: "https://imgur.com", sellPrice: 90 },
            { id: 4, name: "AUG | Stymphalian", rarity: "classified", color: "#d32ce6", chance: 8, img: "https://imgur.com", sellPrice: 250 },
            { id: 5, name: "AK-47 | Searing Rage", rarity: "covert", color: "#eb4b4b", chance: 3.5, img: "https://imgur.com", sellPrice: 850 },
            { id: 6, name: "★ Skeleton Knife | Tiger Tooth", rarity: "special", color: "#e4ae39", chance: 0.5, img: "https://imgur.com", sellPrice: 5000 }
        ];

        let balance = 5000;
        const casePriceOne = 150; 
        let openCount = 1;
        let inventory = [];
        let isRolling = false;
        let selectedItemIndex = null;

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'tick') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(150, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                    osc.start(); osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'win') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {}
        }

        function loadProgress() {
            const savedBalance = localStorage.getItem('bm_balance');
            const savedInv = localStorage.getItem('bm_inventory');
            if (savedBalance !== null) { balance = parseInt(savedBalance); updateBalanceDisplay(); }
            if (savedInv !== null) { inventory = JSON.parse(savedInv); renderInventory(); }
        }

        function saveProgress() {
            localStorage.setItem('bm_balance', balance);
            localStorage.setItem('bm_inventory', JSON.stringify(inventory));
        }

        function updateBalanceDisplay() { document.getElementById('balance-val').innerText = balance; }

        function changeCount(delta) {
            if (isRolling) return;
            openCount = Math.max(1, Math.min(10, openCount + delta));
            document.getElementById('cases-count').innerText = openCount;
        }

        function getRandomSkin() {
            let rand = Math.random() * 100; let cumulativeChance = 0;
            for (let skin of skinsPool) {
                cumulativeChance += skin.chance;
                if (rand <= cumulativeChance) return skin;
            }
            return skinsPool;
        }
        function generateTrack(winningSkin) {
            const track = document.getElementById('roulette-track');
            track.innerHTML = ''; track.style.transition = 'none'; track.style.transform = 'translateX(0px)';
            for (let i = 0; i < 40; i++) {
                let skin = (i === 35) ? winningSkin : skinsPool[Math.floor(Math.random() * skinsPool.length)];
                const item = document.createElement('div');
                item.className = 'roulette-item'; item.style.borderBottomColor = skin.color;
                item.innerHTML = `<img src="${skin.img}" alt="${skin.name}">`;
                track.appendChild(item);
            }
        }

        function startOpen(isFast) {
            if (isRolling) return;
            const totalCost = casePriceOne * openCount;
            if (balance < totalCost) { alert("Недостаточно рублей на балансе!"); return; }
            balance -= totalCost; updateBalanceDisplay(); isRolling = true;
            let roundResults = [];
            for (let i = 0; i < openCount; i++) { roundResults.push(getRandomSkin()); }
            inventory = [...roundResults, ...inventory]; saveProgress();
            if (isFast) {
                renderInventory(); showWinOverlay(roundResults); playSound('win'); isRolling = false;
            } else {
                const mainWinner = roundResults[roundResults.length - 1];
                generateTrack(mainWinner);
                const track = document.getElementById('roulette-track');
                const itemWidth = 95; const wrapperWidth = document.querySelector('.roulette-wrapper').offsetWidth;
                const targetOffset = -(35 * itemWidth - (wrapperWidth / 2) + (90 / 2));
                setTimeout(() => {
                    track.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
                    track.style.transform = `translateX(${targetOffset}px)`;
                    let tickInterval = setInterval(() => playSound('tick'), 150);
                    setTimeout(() => clearInterval(tickInterval), 3500);
                }, 50);
                setTimeout(() => { renderInventory(); showWinOverlay(roundResults); playSound('win'); isRolling = false; }, 4100);
            }
        }

        function showWinOverlay(results) {
            const grid = document.getElementById('win-grid'); grid.innerHTML = '';
            results.forEach(skin => {
                const card = document.createElement('div'); card.className = 'win-card'; card.style.borderBottomColor = skin.color;
                card.innerHTML = `<img src="${skin.img}"><br><b>${skin.name}</b>`; grid.appendChild(card);
            });
            document.getElementById('win-overlay').style.display = 'flex';
        }

        function closeWinOverlay() { document.getElementById('win-overlay').style.display = 'none'; }

        function renderInventory() {
            const container = document.getElementById('inventory-list'); container.innerHTML = '';
            inventory.forEach((skin, index) => {
                const item = document.createElement('div'); item.className = 'inventory-item'; item.style.borderBottomColor = skin.color;
                item.title = `${skin.name} (Нажмите, чтобы продать)`;
                item.onclick = () => openSellModal(index);
                item.innerHTML = `<img src="${skin.img}">`;
                container.appendChild(item);
            });
        }

        function openSellModal(index) {
            if (isRolling) return; selectedItemIndex = index; const skin = inventory[index];
            document.getElementById('sell-item-name').innerText = skin.name;
            document.getElementById('sell-item-rarity').innerText = skin.rarity.toUpperCase();
            document.getElementById('sell-item-rarity').style.color = skin.color;
            document.getElementById('sell-image-container').innerHTML = `<img src="${skin.img}">`;
            const price = skin.sellPrice ? skin.sellPrice : 30;
            document.getElementById('sell-item-price').innerText = price;
            document.getElementById('sell-overlay').style.display = 'flex';
        }

        function closeSellModal() { document.getElementById('sell-overlay').style.display = 'none'; selectedItemIndex = null; }

        function confirmSell() {
            if (selectedItemIndex === null) return; const skin = inventory[selectedItemIndex];
            const price = skin.sellPrice ? skin.sellPrice : 30; balance += price;
            inventory.splice(selectedItemIndex, 1); updateBalanceDisplay(); renderInventory(); saveProgress(); closeSellModal();
        }

        loadProgress();
    </script>
</body>
</html>
