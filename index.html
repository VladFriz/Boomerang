<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boomerang Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0c16;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 40px;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #080911 70%);
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 15px;
            background: rgba(24, 25, 49, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1f2142;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(88, 86, 214, 0.6);
        }

        .balance-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance {
            background: #14152d;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #2e3163;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .balance-icon {
            color: #ffb800;
            text-shadow: 0 0 8px #ffb800;
        }

        /* Сетка разделов и карточки кейсов */
        .section-title {
            font-size: 22px;
            font-weight: 800;
            margin: 25px 15px 15px 15px;
            letter-spacing: 0.5px;
            border-left: 4px solid #5856d6;
            padding-left: 10px;
        }

        .cases-category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px;
            margin-bottom: 25px;
        }

        .case-card {
            background: rgba(24, 25, 49, 0.6);
            border-radius: 20px;
            border: 1px solid #1f2142;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
            padding-bottom: 15px;
        }

        .case-card.active {
            border-color: #ffb800;
            box-shadow: 0 0 15px rgba(255, 184, 0, 0.2);
        }

        .case-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-bottom: 1px solid #1f2142;
        }

        .case-card-title {
            font-size: 16px;
            font-weight: 800;
            margin: 12px 10px 4px 10px;
        }

        .case-card-price {
            font-size: 13px;
            color: #ffb800;
            font-weight: 700;
        }

        /* Окно активной рулетки */
        .roulette-view-zone {
            background: rgba(14, 15, 30, 0.7);
            border-top: 2px solid #2e3163;
            border-bottom: 2px solid #2e3163;
            padding: 25px 15px;
            margin: 20px 0;
            text-align: center;
        }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 140px;
            background: #07080f;
            border-radius: 20px;
            margin: 15px 0 20px 0;
            overflow: hidden;
            border: 1px solid #1c1d3a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .roulette-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #ffb800;
            z-index: 10;
            box-shadow: 0 0 12px #ffb800;
        }

        .roulette-tape {
            display: flex;
            align-items: center;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
        }

        .roulette-item {
            width: 100px;
            height: 110px;
            background: linear-gradient(180deg, #181931 0%, #111226 100%);
            margin: 0 6px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            border: 1px solid #23254e;
        }

        .roulette-item .item-emoji {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .roulette-item span {
            font-size: 12px;
            color: #9da0cb;
            font-weight: 700;
        }

        .btn-open-case {
            background: linear-gradient(135deg, #ffb800 0%, #ff9000 100%);
            color: #07080f;
            border: none;
            padding: 15px 50px;
            border-radius: 18px;
            font-weight: 900;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 144, 0, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { box-shadow: 0 6px 20px rgba(255, 144, 0, 0.4); }
            50% { box-shadow: 0 6px 30px rgba(255, 144, 0, 0.7); }
            100% { box-shadow: 0 6px 20px rgba(255, 144, 0, 0.4); }
        }

        /* Список лута */
        .loot-preview-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 15px;
        }

        .loot-item {
            background: rgba(24, 25, 49, 0.4);
            border-radius: 14px;
            padding: 12px 5px;
            text-align: center;
            border: 1px solid #1c1d3a;
        }

        .loot-icon { font-size: 28px; margin-bottom: 4px; display: block; }
        .loot-name { font-size: 11px; color: #b3b6db; font-weight: 700; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="logo">Boomerang</div>
        <div class="balance-container">
            <div class="balance">
                <span class="balance-icon">₽</span>
                <span id="user-balance">0</span>
            </div>
        </div>
    </div>

    <!-- РАЗДЕЛЫ КЕЙСОВ -->
    <div class="section-title">Доступные кейсы</div>
    <div class="cases-category-grid">
        <!-- Первый кейс с вашей уникальной картинкой -->
        <div class="case-card active">
            <img src="https://githubusercontent.com" onerror="this.src='https://ibb.co'" alt="Бомж Кейс">
            <div class="case-card-title">Бомж Кейс</div>
            <div class="case-card-price">Бесплатно</div>
        </div>
        
        <div class="case-card" style="opacity: 0.5; filter: grayscale(1);">
            <img src="https://ibb.co" onerror="this.src='https://ibb.co'" alt="Армейский">
            <div class="case-card-title">Premium</div>
            <div class="case-card-price">Скоро в игре</div>
        </div>
    </div>

    <!-- ИГРОВАЯ ЗОНА РУЛЕТКИ -->
    <div class="roulette-view-zone">
        <div class="case-card-title" style="font-size: 20px; margin-top:0;">Текущий кейс: Бомж Кейс</div>
        <div class="roulette-wrapper">
            <div class="roulette-tape" id="tape"></div>
        </div>
        <button class="btn-open-case" id="spin-btn" onclick="startSpin()">Крутить Кейс</button>
    </div>

    <!-- ТЕКУЩИЙ ЛУТ -->
    <div class="section-title">Содержимое и шансы</div>
    <div class="loot-preview-grid">
        <div class="loot-item"><span class="loot-icon">🪙</span><div class="loot-name">1 ₽ (98%)</div></div>
        <div class="loot-item"><span class="loot-icon">🪙</span><div class="loot-name">2 ₽ (1%)</div></div>
        <div class="loot-item"><span class="loot-icon">🪙</span><div class="loot-name">3 ₽ (0.5%)</div></div>
        <div class="loot-item"><span class="loot-icon">🪙</span><div class="loot-name">5 ₽ (0.4%)</div></div>
        <div class="loot-item"><span class="loot-icon">🪙</span><div class="loot-name">10 ₽ (0.1%)</div></div>
    </div>
    <script>
        // Математически точный пул призов для генерации ленты (всего 1000 элементов)
        // 1 рубль - 98% (980 шт), 2 рубля - 1% (10 шт), 3 рубля - 0.5% (5 шт), 5 рублей - 0.4% (4 шт), 10 рублей - 0.1% (1 шт)
        const prizeConfig = [
            { icon: '🪙', name: '1 ₽', value: 1, count: 980 },
            { icon: '🪙', name: '2 ₽', value: 2, count: 10 },
            { icon: '🪙', name: '3 ₽', value: 3, count: 5 },
            { icon: '🪙', name: '5 ₽', value: 5, count: 4 },
            { icon: '🪙', name: '10 ₽', value: 10, count: 1 }
        ];

        // Создаем плоский массив на 1000 элементов на основе весов
        let balancedPool = [];
        prizeConfig.forEach(p => {
            for(let i = 0; i < p.count; i++) {
                balancedPool.push({ icon: p.icon, name: p.name, value: p.value });
            }
        });

        const tape = document.getElementById('tape');
        const spinBtn = document.getElementById('spin-btn');
        const balanceDisplay = document.getElementById('user-balance');
        const itemWidth = 112; 

        function generateTape() {
            tape.innerHTML = '';
            // Генерируем длинную ленту прокрутки
            for (let i = 0; i < 55; i++) {
                // Извлекаем абсолютно случайный элемент с учетом заложенных вероятностей
                const randomPrize = balancedPool[Math.floor(Math.random() * balancedPool.length)];
                const item = document.createElement('div');
                item.className = 'roulette-item';
                item.innerHTML = `<div class="item-emoji">${randomPrize.icon}</div><span>${randomPrize.name}</span>`;
                item.dataset.value = randomPrize.value;
                tape.appendChild(item);
            }
        }

        generateTape();

        function startSpin() {
            spinBtn.disabled = true;
            spinBtn.style.animation = 'none';
            spinBtn.style.opacity = '0.4';
            
            generateTape();
            tape.style.transition = 'none';
            tape.style.transform = 'translateX(0px)';
            
            setTimeout(() => {
                const targetIndex = 38; // Индекс победного элемента
                const wrapperWidth = document.querySelector('.roulette-wrapper').offsetWidth;
                const randomShift = Math.floor(Math.random() * 40) - 20; 
                const targetPosition = -(targetIndex * itemWidth) + (wrapperWidth / 2) - (itemWidth / 2) + randomShift;
                
                tape.style.transition = 'transform 4.8s cubic-bezier(0.1, 0.85, 0.1, 1)';
                tape.style.transform = `translateX(${targetPosition}px)`;
                
                setTimeout(() => {
                    const winningItem = tape.children[targetIndex];
                    const prizeValue = parseInt(winningItem.dataset.value);
                    
                    let currentBalance = parseInt(balanceDisplay.innerText);
                    balanceDisplay.innerText = currentBalance + prizeValue;
                    
                    alert(`Выигрыш: +${prizeValue} ₽ зачислено на баланс!`);
                    
                    spinBtn.disabled = false;
                    spinBtn.style.opacity = '1';
                    spinBtn.style.animation = 'pulse 2s infinite ease-in-out';
                }, 4800);
            }, 50);
        }
    </script>
</body>
</html>
